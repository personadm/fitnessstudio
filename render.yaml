# Render-Konfiguration
# Render liest diese Datei beim ersten Connect des Repos und richtet
# den Web-Service automatisch ein.
#
# Geheime Env-Vars (DATABASE_URL, RESEND_API_KEY, ...) werden NICHT hier
# eingetragen – die fügst du im Render-Dashboard manuell ein.

services:
  - type: web
    name: fitnessstudio
    runtime: node
    region: frankfurt
    # standard = 2 GB RAM. Der starter-Plan (512 MB) riss beim Newsletter-
    # Versand wiederholt das Speicherlimit: base64-Bilder blähen das
    # Kampagnen-HTML auf mehrere MB auf, die beim (personalisierten) Versand
    # pro Empfänger im Heap kopiert werden → Render killte den Container
    # ("exceeded its memory limit") und laufende Requests bekamen 502.
    plan: standard
    # Schema-Änderungen NICHT im Build pushen — das verbraucht knappe
    # DB-Pooler-Verbindungen (EMAXCONNSESSION) und kann mit --accept-data-loss
    # Daten zerstören. Schema-Änderungen stattdessen bewusst lokal anwenden:
    #   npm run db:push
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Heap-Limit (--max-old-space-size) wird direkt im start-Script in
      # package.json gesetzt — NICHT hier. Render synchronisiert nachträglich
      # in render.yaml ergänzte envVars nicht zuverlässig in einen bereits
      # angelegten Service; das inline im start-Command gesetzte NODE_OPTIONS
      # greift dagegen immer. (Node deckelt den Heap sonst bei ~256 MB und
      # stürzt beim Newsletter-Versand mit "heap out of memory" ab.) Auf dem
      # 2-GB-standard-Plan steht das Limit auf 1536 MB — genug Luft für den
      # Versand, mit ~500 MB Reserve für Grundverbrauch + native Puffer.
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: STUDIO_NAME
        sync: false
      - key: STUDIO_URL
        sync: false
      - key: TOKEN_SECRET
        sync: false
      # Wird vom externen Scheduler (cron-job.org) als Bearer-Token zum Aufruf
      # von /api/cron/funnels UND /api/cron/campaigns genutzt. Beide Versände
      # laufen so ohne offenes Admin-Panel — siehe SETUP/Doku. Kein
      # kostenpflichtiger Render-Cron nötig.
      #
      #   /api/cron/funnels    → automatische Funnel-Schritt-Mails
      #   /api/cron/campaigns  → Newsletter-/Kampagnen-Versand fortsetzen
      #                          (Sicherheitsnetz; Start erfolgt schon beim
      #                          Klick auf "Versenden" im Admin-Panel)
      - key: CRON_SECRET
        sync: false
