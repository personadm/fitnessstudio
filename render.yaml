# Render-Konfiguration
# Render liest diese Datei beim ersten Connect des Repos und richtet
# den Web-Service automatisch ein.
#
# Geheime Env-Vars (DATABASE_URL, RESEND_API_KEY, ...) werden NICHT hier
# eingetragen – die fügst du im Render-Dashboard manuell ein.

services:
  - type: web
    name: fitnessstudio
    runtime: node
    region: frankfurt
    plan: starter
    # Schema-Änderungen NICHT im Build pushen — das verbraucht knappe
    # DB-Pooler-Verbindungen (EMAXCONNSESSION) und kann mit --accept-data-loss
    # Daten zerstören. Schema-Änderungen stattdessen bewusst lokal anwenden:
    #   npm run db:push
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: STUDIO_NAME
        sync: false
      - key: STUDIO_URL
        sync: false
      - key: TOKEN_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false

  # Cron-Job: stößt alle 5 Minuten den Funnel-Versand an, indem er den
  # geschützten Endpoint /api/cron/funnels des Web-Service aufruft. Dadurch
  # gehen fällige Mails auch ohne offenes Admin-Panel raus.
  - type: cron
    name: funnel-cron
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "*/5 * * * *"
    # Kein App-Build nötig — der Job ruft nur eine URL auf.
    buildCommand: ""
    # -f: bei HTTP-Fehler (4xx/5xx) mit Fehlercode abbrechen → im Render-Log sichtbar.
    startCommand: curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$CRON_TARGET_URL/api/cron/funnels"
    envVars:
      - key: CRON_SECRET
        sync: false
      # Öffentliche URL des Web-Service, z. B. https://fitnessstudio.onrender.com
      - key: CRON_TARGET_URL
        sync: false
